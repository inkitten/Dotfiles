# ===============================
# Middle-earth Theme for Foot
# Forests • Firelight • Stone • Parchment
# ===============================


[main]

font=FiraCode Nerd Font:size=15
pad=12x12

# Use our dark theme
initial-color-theme=dark


[cursor]

style=block
blink=yes
blink-rate=800


[colors-dark]

# --- Base ---

background=1b1f1d
foreground=d8d4c0

# 85% transparency
alpha=0.85


# --- Selection ---

selection-background=3a4a3f
selection-foreground=f5f2e8


# --- Normal ANSI colors ---

# Black        Red         Green       Yellow
regular0=2a2e2b
regular1=8f3f2f
regular2=5f7f5f
regular3=c2a24f

# Blue         Magenta     Cyan        White
regular4=4f6f8f
regular5=7f5f7f
regular6=5f8f8f
regular7=d8d4c0


# --- Bright ANSI colors ---

bright0=3a3f3c
bright1=b24a3a
bright2=7fa77f
bright3=e0c36f

bright4=6f8faf
bright5=9f7f9f
bright6=7fbfbf
bright7=f5f2e8


# --- Cursor ---

# foreground cursor-text
# background cursor
cursor=1b1b1b c2b280


# --- URLs ---

urls=7fa77f


# --- Terminal flash ---

flash=8f3f2f
flash-alpha=0.15


# --- Scrollback indicator ---

scrollback-indicator=2a2e2b c2a24f


# --- Search box ---

search-box-match=1b1f1d c2a24f
search-box-no-match=f5f2e8 8f3f2f


[bell]

system=no
