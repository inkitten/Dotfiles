# ===============================
# Middle-earth Theme for Kitty
# Inspired by forests, firelight, stone, and ancient parchment
# ===============================

# --- Font ---
# font_family      FiraCode Nerd Font
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
font_size        15.0

# --- Cursor ---
cursor            #c2b280     
# parchment gold
cursor_text_color #1b1b1b
cursor_shape      block
cursor_blink_interval 0.8

# --- Window ---
background_opacity 0.85
# window_padding_width 12
remember_window_size yes

# --- Colors: Base ---
background #1b1f1d
# dark forest night
foreground #d8d4c0
# aged parchment

selection_background #3a4a3f
selection_foreground #f5f2e8

# --- ANSI Colors ---
color0  #2a2e2b  
# black stone
color1  #8f3f2f  
# Mordor red
color2  #5f7f5f  
# elven green
color3  #c2a24f  
# Rohan gold
color4  #4f6f8f  
# Gondor blue
color5  #7f5f7f  
# wizard purple
color6  #5f8f8f  
# misty teal
color7  #d8d4c0  
# parchment white

# --- Bright ANSI ---
color8  #3a3f3c
color9  #b24a3a
color10 #7fa77f
color11 #e0c36f
color12 #6f8faf
color13 #9f7f9f
color14 #7fbfbf
color15 #f5f2e8

# --- Tabs ---
active_tab_background   #2f3a33
active_tab_foreground   #e0dcc8
inactive_tab_background #1b1f1d
inactive_tab_foreground #6f7268

# --- Borders ---
active_border_color   #c2a24f
inactive_border_color #3a3f3c

# --- URL Style ---
url_color #7fa77f

# --- Bell ---
enable_audio_bell no
visual_bell_duration 0.15
visual_bell_color #8f3f2f


# BEGIN_KITTY_FONTS
font_family      family='FiraCode Nerd Font' postscript_name=FiraCodeNF-Reg
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
